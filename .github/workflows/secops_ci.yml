name: Policy & Security Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: OPA Policy & Manifest Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install YAML Parser
        run: pip install pyyaml

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: "v0.68.0"

      - name: Check Rego Policies
        run: |
          if [ -d "1-policy-as-code" ]; then
            opa check 1-policy-as-code/ || true
          fi

      - name: Validate Kubernetes & YAML Schemas
        run: |
          python3 -c "
import glob, sys, yaml
for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True):
    if '.github' in f: continue
    try:
        with open(f, 'r') as stream:
            list(yaml.safe_load_all(stream))
    except Exception as e:
        print(f'Warning in {f}: {e}')
print('Manifest inspection completed successfully.')
"
