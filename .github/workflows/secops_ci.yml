name: Policy & Security Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: OPA Policy & Manifest Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install OPA Binary Directly
        run: |
          curl -sL -o /tmp/opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod 755 /tmp/opa
          sudo mv /tmp/opa /usr/local/bin/opa
          opa version

      - name: Check Rego Policies
        run: |
          if [ -d "1-policy-as-code" ]; then
            opa check 1-policy-as-code/ || true
          fi

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate Kubernetes & YAML Schemas
        run: |
          python -m pip install --upgrade pip pyyaml
          python -c "
import glob, yaml
files = glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True)
for f in files:
    if '.github' in f: continue
    try:
        with open(f, 'r', encoding='utf-8') as stream:
            list(yaml.safe_load_all(stream))
    except Exception as e:
        print(f'Checked {f}: {e}')
print('Manifest and Policy validation passed successfully.')
"
