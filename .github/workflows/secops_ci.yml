name: Policy & Security Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: OPA Policy & Manifest Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Install OPA Engine
        run: |
          curl -sL -o opa https://github.com/open-policy-agent/opa/releases/download/v0.68.0/opa_linux_amd64_static
          chmod 755 opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Check Rego Policies
        run: |
          if [ -d "1-policy-as-code" ]; then
            opa check 1-policy-as-code/ || true
          fi

      - name: Validate Kubernetes Manifests
        run: |
          python -c "import glob, yaml; files = [f for f in glob.glob('**/*.yaml', recursive=True) + glob.glob('**/*.yml', recursive=True) if '.github' not in f]; [list(yaml.safe_load_all(open(f, encoding='utf-8'))) for f in files]; print(f'Successfully validated {len(files)} manifests.')"
